name: Build Android iOS Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # Android
  # =========================
  android:
    name: Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: simple_live_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.38
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error


  # =========================
  # iOS - unsigned IPA
  # =========================
  ios:
    name: iOS IPA unsigned
    runs-on: macos-latest

    defaults:
      run:
        working-directory: simple_live_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.38
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry SimpleLive-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Unsigned
          path: simple_live_app/build/ios/iphoneos/SimpleLive-iOS-unsigned.ipa
          if-no-files-found: error


  # =========================
  # Windows x64 portable
  # =========================
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        working-directory: simple_live_app
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.38
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable ZIP
        run: |
          $src = "build/windows/x64/runner/Release"
          $zip = "build/SimpleLive-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-Portable
          path: simple_live_app/build/SimpleLive-Windows-x64.zip
          if-no-files-found: error
